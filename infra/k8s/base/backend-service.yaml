apiVersion: v1
kind: Service
metadata:
  name: kubewatch-backend
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-backend
    app.kubernetes.io/part-of: kubewatch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubewatch-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
