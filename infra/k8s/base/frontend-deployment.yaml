apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-frontend
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-frontend
    app.kubernetes.io/part-of: kubewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewatch-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-frontend
        app.kubernetes.io/part-of: kubewatch
    spec:
      containers:
        - name: frontend
          image: kubewatch-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
