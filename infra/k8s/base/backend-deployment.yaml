apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-backend
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-backend
    app.kubernetes.io/part-of: kubewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewatch-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-backend
        app.kubernetes.io/part-of: kubewatch
    spec:
      containers:
        - name: backend
          image: kubewatch-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000

          # Import every key in the ConfigMap as an environment variable.
          envFrom:
            - configMapRef:
                name: kubewatch-backend-config

          # Import only the required key from the Secret.
          env:
            - name: KUBEWATCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubewatch-backend-secret
                  key: KUBEWATCH_API_KEY
                  # Keep the application runnable when no Secret exists.
                  optional: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
