apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubewatch

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

# Generate a ConfigMap whose name includes a content hash.
# When the content changes, the generated name and Deployment reference change.
configMapGenerator:
  - name: kubewatch-backend-config
    literals:
      - KUBEWATCH_APP_NAME=KubeWatch API via ConfigMap
      - KUBEWATCH_LOG_LEVEL=info

generatorOptions:
  labels:
    app.kubernetes.io/name: kubewatch-backend
    app.kubernetes.io/part-of: kubewatch
