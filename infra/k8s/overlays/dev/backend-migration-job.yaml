apiVersion: batch/v1
kind: Job
metadata:
  name: kubewatch-backend-migration
  labels:
    app.kubernetes.io/name: kubewatch-backend-migration
    app.kubernetes.io/part-of: kubewatch
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-backend-migration
        app.kubernetes.io/part-of: kubewatch
    spec:
      serviceAccountName: kubewatch-backend
      restartPolicy: OnFailure
      initContainers:
        # A native sidecar starts before the migration and terminates when the
        # Job's main container exits, allowing the Job to reach Complete.
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:0b7fc3a63ac4b48163b8b2181e3ca47abade9d671d10908ba0ad3ba2935e392d
          args:
            - --structured-logs
            - --port=5432
            - study-gcp-cicd:asia-northeast3:kubewatch-dev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      containers:
        - name: migrate
          image: kubewatch-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              /app/.venv/bin/python - <<'PY'
              import socket
              import time

              deadline = time.monotonic() + 60
              while True:
                  try:
                      with socket.create_connection(("127.0.0.1", 5432), timeout=1):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(1)
              PY
              exec /app/.venv/bin/alembic upgrade head
          envFrom:
            - configMapRef:
                name: kubewatch-backend-config
          env:
            - name: KUBEWATCH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubewatch-database-secret
                  key: KUBEWATCH_DATABASE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
