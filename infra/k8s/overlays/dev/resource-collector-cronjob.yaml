apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubewatch-resource-collector
  labels:
    app.kubernetes.io/name: kubewatch-resource-collector
    app.kubernetes.io/part-of: kubewatch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubewatch-resource-collector
            app.kubernetes.io/part-of: kubewatch
        spec:
          serviceAccountName: kubewatch-collector
          restartPolicy: OnFailure
          initContainers:
            # A native sidecar exits with the Job's main container.
            - name: cloud-sql-proxy
              restartPolicy: Always
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:0b7fc3a63ac4b48163b8b2181e3ca47abade9d671d10908ba0ad3ba2935e392d
              args:
                - --structured-logs
                - --port=5432
                - study-gcp-cicd:asia-northeast3:kubewatch-dev
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
          containers:
            - name: collector
              image: kubewatch-backend:local
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
              args:
                - |
                  /app/.venv/bin/python - <<'PY'
                  import socket
                  import time

                  deadline = time.monotonic() + 60
                  while True:
                      try:
                          with socket.create_connection(("127.0.0.1", 5432), timeout=1):
                              break
                      except OSError:
                          if time.monotonic() >= deadline:
                              raise
                          time.sleep(1)
                  PY
                  exec /app/.venv/bin/kubewatch-collector
              envFrom:
                - configMapRef:
                    name: kubewatch-backend-config
              env:
                - name: KUBEWATCH_COLLECTOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: KUBEWATCH_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kubewatch-database-secret
                      key: KUBEWATCH_DATABASE_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
