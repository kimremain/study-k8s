apiVersion: batch/v1
kind: Job
metadata:
  name: kubewatch-backend-migration
  labels:
    app.kubernetes.io/name: kubewatch-backend-migration
    app.kubernetes.io/part-of: kubewatch
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-backend-migration
        app.kubernetes.io/part-of: kubewatch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: kubewatch-backend:local
          imagePullPolicy: Never
          command:
            - /app/.venv/bin/alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: kubewatch-backend-config
          env:
            - name: KUBEWATCH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubewatch-database-secret
                  key: KUBEWATCH_DATABASE_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
