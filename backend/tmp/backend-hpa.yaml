apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubewatch-backend-local
  namespace: kubewatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubewatch-backend-local
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
