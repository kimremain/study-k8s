apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubewatch-healthcheck
  namespace: kubewatch
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: healthcheck
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "healthcheck started: $(date -u)"
                  wget -qO- http://kubewatch-backend-local:8000/healthz
                  echo
