apiVersion: v1
kind: Pod
metadata:
  name: pvc-writer
  namespace: kubewatch
spec:
  restartPolicy: Never
  containers:
  - name: writer
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "PVC data written at $(date -u)" > /data/message.txt
      sync
      sleep 3600
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: kubewatch-data-lab
