apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: kubewatch
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6 7 8; do
            while true; do
              wget -q -O- http://kubewatch-backend-local:8000/healthz >/dev/null
            done &
          done
          wait
